<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>体系任务监控台</title>
  <style>
    :root{--bg:#061019;--panel:#091923e8;--line:#203b49;--text:#dcecf3;--muted:#78909c;--cyan:#46d5ef;--red:#ff626e;--green:#58d7a9;--amber:#f0bc5b}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px system-ui,"Microsoft YaHei",sans-serif}.app{height:100%;display:grid;grid-template-rows:54px 1fr 196px}.top{display:flex;align-items:center;gap:24px;padding:0 18px;border-bottom:1px solid var(--line);background:#07141e}.brand{font-size:16px;font-weight:700}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:400}.health{color:var(--green);font-size:11px}.integration{margin-left:auto;display:flex;gap:8px}.chip{padding:5px 9px;border:1px solid #294756;border-radius:12px;color:#8fa8b3;font-size:9px}.main{min-height:0;display:grid;grid-template-columns:224px 1fr 330px}.fleet,.detail{min-height:0;overflow:auto;background:var(--panel)}.fleet{border-right:1px solid var(--line);padding:12px}.detail{border-left:1px solid var(--line);padding:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;color:#9eb4bd;font-size:10px;letter-spacing:1px}.asset{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;margin:5px 0;padding:8px;border:1px solid transparent;border-radius:6px;background:#0c1d27;color:var(--text);text-align:left;cursor:pointer}.asset:hover,.asset.active{border-color:#327187;background:#102a36}.asset .symbol{font-size:18px;text-align:center}.asset b{display:block;font-size:10px}.asset small{color:var(--muted);font-size:8px}.asset em{color:var(--green);font-size:8px;font-style:normal}.map{position:relative;overflow:hidden;background:radial-gradient(circle at 35% 20%,#153646 0,#092332 36%,transparent 58%),linear-gradient(160deg,#0b2634 0 54%,#09202d 54% 100%)}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#3b64721c 1px,transparent 1px),linear-gradient(90deg,#3b64721c 1px,transparent 1px);background-size:48px 48px}.coast{position:absolute;left:-10%;top:-5%;width:56%;height:115%;background:#142a2b;clip-path:polygon(0 0,82% 0,68% 15%,83% 33%,66% 48%,76% 62%,60% 80%,72% 100%,0 100%);border-right:1px solid #527164}.domain-label{position:absolute;color:#60808c;font-size:11px;letter-spacing:3px}.air-label{top:20px;left:48%}.sea-label{bottom:18px;right:22px}.platform{position:absolute;z-index:3;transform:translate(-50%,-50%);border:0;background:transparent;color:var(--cyan);cursor:pointer}.platform .icon{display:grid;place-items:center;width:28px;height:28px;border:1px solid currentColor;border-radius:50%;background:#07151ddb;box-shadow:0 0 12px currentColor;font-size:15px}.platform.tasked .icon{animation:pulse 1.1s infinite}.platform.selected .icon{outline:2px solid #fff8;outline-offset:3px}.platform label{position:absolute;left:34px;top:2px;width:145px;color:#cce0e7;font-size:9px;text-align:left;text-shadow:0 1px 3px #000}.platform label small{display:block;color:#78939e}.threat{position:absolute;z-index:4;transform:translate(-50%,-50%);color:var(--red)}.threat .diamond{width:22px;height:22px;transform:rotate(45deg);border:2px solid var(--red);background:#5e1823aa;box-shadow:0 0 18px var(--red);animation:pulse 1.2s infinite}.threat label{position:absolute;left:26px;top:-10px;width:150px;color:#ffadb3;font-size:10px}.link{position:absolute;z-index:2;height:1px;transform-origin:0 0;background:repeating-linear-gradient(90deg,#e4a7aa 0 7px,transparent 7px 13px);opacity:.7}.stage-banner{position:absolute;left:18px;top:16px;z-index:5;width:310px;padding:12px;border:1px solid #315262;border-left:3px solid var(--cyan);border-radius:6px;background:#071721df;backdrop-filter:blur(8px)}.stage-banner b{font-size:12px}.stage-banner p{margin:6px 0 0;color:#91a8b2;font-size:9px;line-height:1.5}.eyebrow{color:var(--cyan);font-size:8px;letter-spacing:1px}.toolbar{position:absolute;left:18px;bottom:16px;z-index:6;display:flex;gap:7px}.toolbar button{padding:8px 13px;border:1px solid #315262;border-radius:5px;background:#0d2531;color:#cce3eb;cursor:pointer}.toolbar button.primary{background:#15506a;border-color:#2f85a5}.toolbar button:disabled{opacity:.45}.detail h2{margin:5px 0 4px;font-size:16px}.meta{color:var(--muted);font-size:9px}.sensor-grid{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}.sensor{padding:9px;border:1px solid #23404e;border-radius:5px;background:#0d202a}.sensor-head{display:flex;justify-content:space-between}.sensor b{font-size:10px}.sensor .ok{color:var(--green);font-size:8px}.sensor-value{margin:6px 0;color:#b8ccd4;font-size:10px}.bar{height:3px;background:#19313b}.bar i{display:block;height:100%;background:var(--cyan)}.source{margin-top:5px;color:#607b86;font-size:8px}.evidence{margin-top:12px;padding:10px;border:1px solid #4e3035;border-radius:6px;background:#1b1116}.evidence h3{margin:0 0 8px;color:#ff9ca4;font-size:10px}.evidence div{margin:5px 0;color:#aa8589;font-size:9px}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line);background:#07141e}.stage{position:relative;padding:12px;border:1px solid #213b48;border-radius:7px;background:#0a1b25}.stage:before{content:"";position:absolute;left:-9px;top:25px;width:9px;height:1px;background:#31515f}.stage:first-child:before{display:none}.stage.completed{border-color:#285f51}.stage.active{border-color:#3b8ba7;box-shadow:0 0 20px #2f91b02c}.stage .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#17323e;color:#83dff5;font-size:9px}.stage.completed .num{background:#1d4d40;color:#75e0b6}.stage h3{display:inline;margin-left:7px;font-size:10px}.stage p{height:40px;margin:8px 0;color:#79929d;font-size:8px;line-height:1.45;overflow:hidden}.stage footer{display:flex;justify-content:space-between;color:#597580;font-size:8px}.stage.active footer{color:#69cde9}@keyframes pulse{50%{filter:brightness(1.6);transform:scale(1.12)}}@media(max-width:1000px){.main{grid-template-columns:180px 1fr 280px}.integration{display:none}.app{grid-template-rows:54px 1fr 175px}}
  </style>
</head>
<body><main class="app"><header class="top"><div class="brand">体系任务监控台<small>FAKE LATTICE · 多域无人装备统一接入与协同感知</small></div><span class="health">● 8 个平台在线</span><div class="integration"><span class="chip">设备接入：Kubernetes 兼容接口</span><span class="chip">消息总线：Fast DDS 兼容接口</span></div></header><section class="main"><aside class="fleet"><div class="section-title"><span>统一装备目录</span><span id="fleet-count">0</span></div><div id="fleet"></div></aside><section class="map" id="map"><div class="coast"></div><span class="domain-label air-label">空域</span><span class="domain-label sea-label">海域</span><div class="stage-banner"><div class="eyebrow" id="stage-actor">场景准备</div><b id="stage-name">加载协同任务</b><p id="stage-summary"></p></div><div id="links"></div><div id="platforms"></div><div id="threat"></div><div class="toolbar"><button id="reset">重新演示</button><button class="primary" id="advance">推进下一步</button><button id="auto">自动演示</button></div></section><aside class="detail"><div class="eyebrow">当前选中装备</div><h2 id="asset-name">请选择平台</h2><div class="meta" id="asset-meta"></div><div class="section-title" style="margin-top:16px"><span>实时传感器参数</span><span id="sensor-count">0</span></div><div class="sensor-grid" id="sensors"></div><div class="evidence"><h3>当前情报完整度 <span id="confidence">--</span></h3><div id="evidence"></div></div></aside></section><section class="timeline" id="timeline"></section></main>
<script>
let state,selected='uav-rq01',timer;const $=s=>document.querySelector(s),esc=v=>String(v??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function platformCard(p){return `<button class="asset ${p.platformId===selected?'active':''}" data-id="${p.platformId}"><span class="symbol" style="color:${p.color}">${p.symbol}</span><span><b>${esc(p.name)}</b><small>${esc(p.kind)} · ${esc(p.domain)}</small></span><em>${p.missionStatus==='tasked'?'任务中':'监视'}</em></button>`}
function renderFleet(){ $('#fleet-count').textContent=`${state.platforms.length} 个平台`;$('#fleet').innerHTML=state.platforms.map(platformCard).join('');document.querySelectorAll('.asset').forEach(x=>x.onclick=()=>{selected=x.dataset.id;render()}) }
function renderMap(){const tasked=new Set(state.activeStage.platformIds||[]);$('#platforms').innerHTML=state.platforms.map(p=>`<button class="platform ${tasked.has(p.platformId)?'tasked':''} ${p.platformId===selected?'selected':''}" data-id="${p.platformId}" style="left:${p.position.x}%;top:${p.position.y}%;color:${p.color}"><span class="icon">${p.symbol}</span><label>${esc(p.name)}<small>${p.position.altitudeM} m · ${p.missionStatus==='tasked'?'执行协同任务':'自主监视'}</small></label></button>`).join('');document.querySelectorAll('.platform').forEach(x=>x.onclick=()=>{selected=x.dataset.id;render()});const t=state.threat;$('#threat').innerHTML=`<div class="threat" style="left:${t.position.x}%;top:${t.position.y}%"><div class="diamond"></div><label>T-01 · ${esc(t.classification)}<br>情报完整度 ${Math.round(state.activeStage.confidence*100)}%</label></div>`;const target={x:t.position.x,y:t.position.y};$('#links').innerHTML=state.platforms.filter(p=>tasked.has(p.platformId)).map(p=>{const dx=target.x-p.position.x,dy=target.y-p.position.y,len=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)*180/Math.PI;return `<i class="link" style="left:${p.position.x}%;top:${p.position.y}%;width:${len}%;transform:rotate(${angle}deg)"></i>`}).join('')}
function renderDetail(){const p=state.platforms.find(x=>x.platformId===selected)||state.platforms[0];$('#asset-name').textContent=p.name;$('#asset-meta').textContent=`${p.platformId} · ${p.kind} · 高度 ${p.position.altitudeM} m · 航向 ${p.heading}°`;$('#sensor-count').textContent=`${p.sensors.length} 个`;$('#sensors').innerHTML=p.sensors.map(s=>`<div class="sensor"><div class="sensor-head"><b>${esc(s.type)}</b><span class="ok">● 正常</span></div><div class="sensor-value">${esc(s.displayValue)}</div><div class="bar"><i style="width:${Math.round(s.quality*100)}%"></i></div><div class="source">质量 ${Math.round(s.quality*100)}% · ${esc(s.provenance.source)}</div></div>`).join('');$('#confidence').textContent=`${Math.round(state.activeStage.confidence*100)}%`;$('#evidence').innerHTML=state.activeStage.evidence.map(x=>`<div>› ${esc(x)}</div>`).join('')}
function renderTimeline(){ $('#timeline').innerHTML=state.stages.map((s,i)=>`<article class="stage ${s.status}"><span class="num">${i+1}</span><h3>${esc(s.name)}</h3><p>${esc(s.summary)}</p><footer><span>${esc(s.skill)}</span><span>${Math.round(s.confidence*100)}%</span></footer></article>`).join('') }
function render(){const s=state.activeStage;$('#stage-actor').textContent=`${s.actor} · ${s.skill}`;$('#stage-name').textContent=s.name;$('#stage-summary').textContent=s.summary;$('#advance').disabled=state.complete;renderFleet();renderMap();renderDetail();renderTimeline()}
async function call(path){const r=await fetch(path,{method:'POST'});state=await r.json();render()}
$('#advance').onclick=()=>call('/api/v1/mission-scenario/advance');$('#reset').onclick=()=>call('/api/v1/mission-scenario/reset');$('#auto').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='自动演示';return}e.target.textContent='停止自动';timer=setInterval(async()=>{if(state.complete){await call('/api/v1/mission-scenario/reset')}else await call('/api/v1/mission-scenario/advance')},2600)};
fetch('/api/v1/mission-scenario').then(r=>r.json()).then(x=>{state=x;render()}).catch(e=>{$('#stage-summary').textContent=`场景服务不可用：${e.message}`});
</script></body></html>
