<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型配置</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131b;color:#dcecf3;font:14px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px}h1{font-size:22px;margin:0 0 6px}p{color:#8faab5;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#0c202b;border:1px solid #294653;border-radius:10px;padding:20px}.wide{grid-column:1/-1}h2{font-size:15px;color:#83d8f3;margin:0 0 14px}label{display:block;margin:12px 0 6px;color:#9db5bf}input,select,button{width:100%;padding:10px;border-radius:6px;border:1px solid #365763;background:#102b37;color:#edf8fb}button{cursor:pointer;background:#176485;border-color:#2889b0;font-weight:600;margin-top:11px}.row{display:grid;grid-template-columns:1fr 150px;gap:10px}.status{min-height:22px;margin-top:11px;color:#77d29d}.hint{color:#7e99a5;font-size:12px;line-height:1.6}.masked{font-family:monospace;color:#96c8d8}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="wrap"><h1>模型供应商配置</h1><p>发现、检测并配置处置建议模型与知识库向量模型</p><section class="grid"><div class="card wide"><h2>服务连接</h2><label>接口类型</label><select disabled><option>OpenAI 兼容接口</option></select><label>服务地址</label><input id="base" placeholder="https://服务地址/v1"><label>API Key</label><input id="key" type="password" autocomplete="new-password" placeholder="留空表示继续使用已保存的 Key"><div class="hint" id="keyHint">尚未保存密钥</div><button id="discover">检测连接并发现模型</button><div class="status" id="connection"></div></div><div class="card"><h2>处置建议模型</h2><label>对话模型</label><select id="chat"><option value="">请先检测连接</option></select><button id="testChat">测试文本生成</button><div class="status" id="chatStatus"></div></div><div class="card"><h2>知识库向量模型</h2><label>Embedding 模型</label><select id="embedding"><option value="">请先检测连接</option></select><button id="testEmbedding">测试向量生成</button><div class="status" id="embeddingStatus"></div></div><div class="card wide"><div class="row"><button id="save">保存配置</button><button id="refresh">刷新状态</button></div><div class="status" id="saveStatus"></div><div class="hint">完整 API Key 不会从后端返回。切换 Embedding 模型后，应重新向量化已有文档。</div></div></section></main><script>
const $=s=>document.querySelector(s);let dimension=0;function add(select,value){if(value&&![...select.options].some(o=>o.value===value))select.add(new Option(value,value));select.value=value}async function config(){const c=await fetch('/api/v1/model-provider/config').then(r=>r.json());$('#base').value=c.baseUrl||'';$('#keyHint').innerHTML=c.apiKeyConfigured?`已保存：<span class="masked">${c.apiKeyMasked}</span>`:'尚未保存密钥';add($('#chat'),c.chatModel);add($('#embedding'),c.embeddingModel);dimension=c.embeddingDimension||0}function values(){return{baseUrl:$('#base').value.trim(),apiKey:$('#key').value}}function fill(select,list,current){select.innerHTML='<option value="">请选择模型</option>';list.forEach(v=>select.add(new Option(v,v)));add(select,current)}
$('#discover').onclick=async()=>{const n=$('#connection');n.textContent='正在连接并获取模型…';const r=await fetch('/api/v1/model-provider/discover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values())});const b=await r.json();if(!r.ok){n.textContent=b.detail||'连接失败';return}fill($('#chat'),b.models.chat,$('#chat').value);fill($('#embedding'),b.models.embedding,$('#embedding').value);n.textContent=`连接正常，共发现 ${b.models.all.length} 个模型`};
async function test(capability,model,node){node.textContent='正在执行真实能力测试…';const r=await fetch('/api/v1/model-provider/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...values(),capability,model})});const b=await r.json();if(!r.ok){node.textContent=b.detail||'测试失败';return}if(capability==='embedding')dimension=b.dimension;node.textContent=capability==='embedding'?`测试通过，向量维度 ${b.dimension}`:`测试通过：${b.sample}`}
$('#testChat').onclick=()=>test('chat',$('#chat').value,$('#chatStatus'));$('#testEmbedding').onclick=()=>test('embedding',$('#embedding').value,$('#embeddingStatus'));$('#save').onclick=async()=>{const r=await fetch('/api/v1/model-provider/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...values(),chatModel:$('#chat').value,embeddingModel:$('#embedding').value,embeddingDimension:dimension})});const b=await r.json();$('#saveStatus').textContent=r.ok?'配置已安全保存':b.detail||'保存失败';if(r.ok){$('#key').value='';await config()}};$('#refresh').onclick=config;config();
</script></body></html>
