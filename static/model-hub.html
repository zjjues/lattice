<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型管理</title><style>
:root{--bg:#07131b;--panel:#0c202b;--line:#294653;--text:#dcecf3;--muted:#829da8;--cyan:#69d5f5;--green:#65d49b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}.top{height:70px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid #27414d;background:#091923}.top h1{margin:0;font-size:20px}.top p{margin:5px 0 0;color:var(--muted);font-size:11px}.wrap{padding:22px 26px;max-width:1180px;margin:auto}.heading{display:flex;align-items:center;margin-bottom:16px}.heading h2{margin:0;font-size:16px}.button{border:1px solid #2b7896;border-radius:7px;background:#15526b;color:#e3f8ff;padding:9px 15px;cursor:pointer}.primary{margin-left:auto;background:#167398}.models{display:grid;grid-template-columns:1fr 1fr;gap:14px}.model{padding:20px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.model-head{display:flex;align-items:center;gap:11px}.icon{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;background:#143747;color:#75d8f5;font-weight:bold}.model h3{margin:0 0 4px;font-size:15px}.tag{padding:3px 7px;border-radius:10px;background:#14392d;color:#78dca5;font-size:9px}.model dl{display:grid;grid-template-columns:90px 1fr;gap:9px;margin:18px 0 0}.model dt{color:#718d99;font-size:11px}.model dd{margin:0;color:#c5d7de;font-size:11px;word-break:break-all}.add{display:none;margin-top:18px;padding:22px;border:1px solid #315463;border-radius:11px;background:#0b202b}.add.show{display:block}.add h2{margin:0 0 5px;font-size:16px}.add p{color:var(--muted);font-size:11px}.form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.wide{grid-column:1/-1}label{display:block;margin:12px 0 6px;color:#91aab5;font-size:11px}input,select{width:100%;padding:10px;border:1px solid #355663;border-radius:6px;background:#0d2935;color:#e9f7fb}.actions{display:flex;gap:9px;margin-top:15px}.status{min-height:18px;margin-top:9px;color:var(--green);font-size:11px}.hint{margin-top:12px;color:#78939e;font-size:10px;line-height:1.6}@media(max-width:760px){.models,.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header class="top"><div><h1>模型管理</h1><p>查看当前生效模型及其访问方式，新增或切换兼容模型服务</p></div></header><main class="wrap"><div class="heading"><h2>当前使用模型</h2><button id="showAdd" class="button primary">＋ 新增大模型</button></div><section class="models"><article class="model"><div class="model-head"><div class="icon">LLM</div><div><h3 id="chatName">尚未配置</h3><span id="chatMode" class="tag">API访问</span></div></div><dl><dt>用途</dt><dd>处置方案生成</dd><dt>服务供应商</dt><dd id="providerName">-</dd><dt>服务地址</dt><dd id="baseValue">-</dd><dt>密钥状态</dt><dd id="keyValue">-</dd></dl></article><article class="model"><div class="model-head"><div class="icon">向量</div><div><h3 id="embeddingName">尚未配置</h3><span id="embeddingMode" class="tag">本地部署</span></div></div><dl><dt>用途</dt><dd>知识库向量化与检索</dd><dt>运行方式</dt><dd id="embeddingRuntime">-</dd><dt>向量维度</dt><dd id="dimensionValue">-</dd><dt>模型目录</dt><dd id="embeddingPath">-</dd></dl></article></section>
<section id="addPanel" class="add"><h2>新增或切换大模型</h2><p>当前支持 OpenAI 兼容接口；检测成功并保存后成为处置建议的当前模型。</p><div class="form"><div class="wide"><label>服务地址</label><input id="base" placeholder="https://api.example.com/v1"></div><div class="wide"><label>API Key</label><input id="key" type="password" autocomplete="new-password" placeholder="输入新密钥；留空则沿用已保存密钥"></div><div><label>对话模型</label><select id="chat"><option value="">请先检测连接</option></select></div><div><label>Embedding模型</label><select id="embedding"><option value="">本地 BGE 可直接使用</option></select></div></div><div class="actions"><button id="discover" class="button">检测并识别模型</button><button id="testChat" class="button">测试当前选择</button><button id="save" class="button">保存并启用</button><button id="cancel" class="button">取消</button></div><div id="status" class="status"></div><div class="hint">API Key只保存在本机配置文件，后端不会向界面返回完整密钥。本地BGE与API对话模型可以组合使用。</div></section></main><script>
const $=s=>document.querySelector(s);let configValue={},dimension=0;const localBge='BAAI/bge-small-zh-v1.5';function add(select,value){if(value&&![...select.options].some(o=>o.value===value))select.add(new Option(value,value));if(value)select.value=value}function providerName(url){if(url.includes('deepseek'))return'DeepSeek';if(url.includes('openai'))return'OpenAI兼容服务';return url?'OpenAI兼容供应商':'未配置'}
async function load(){const c=await fetch('/api/v1/model-provider/config').then(r=>r.json());configValue=c;dimension=c.embeddingDimension||0;$('#chatName').textContent=c.chatModel||'尚未配置';$('#chatMode').textContent='API访问';$('#providerName').textContent=providerName(c.baseUrl||'');$('#baseValue').textContent=c.baseUrl||'-';$('#keyValue').textContent=c.apiKeyConfigured?`已配置 ${c.apiKeyMasked}`:'未配置';$('#embeddingName').textContent=c.embeddingModel||'尚未配置';const local=c.embeddingModel===localBge;$('#embeddingMode').textContent=local?'本地部署':'API访问';$('#embeddingRuntime').textContent=local?'CPU · ONNX · FastEmbed':'远程Embedding接口';$('#dimensionValue').textContent=dimension||'-';$('#embeddingPath').textContent=local?'D:\\lattice-data\\models\\fastembed':c.baseUrl||'-';$('#base').value=c.baseUrl||'';add($('#chat'),c.chatModel);add($('#embedding'),c.embeddingModel)}
function values(){return{baseUrl:$('#base').value.trim(),apiKey:$('#key').value}}function fill(select,list,current){select.innerHTML='<option value="">请选择模型</option>';list.forEach(v=>select.add(new Option(v,v)));add(select,current)}
$('#showAdd').onclick=()=>{$('#addPanel').classList.add('show');$('#base').focus()};$('#cancel').onclick=()=>$('#addPanel').classList.remove('show');
$('#discover').onclick=async()=>{$('#status').textContent='正在连接并识别模型…';const r=await fetch('/api/v1/model-provider/discover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values())}),b=await r.json();if(!r.ok){$('#status').textContent=b.detail||'连接失败';return}fill($('#chat'),b.models.chat,configValue.chatModel);fill($('#embedding'),b.models.embedding,configValue.embeddingModel||localBge);$('#status').textContent=`连接正常，识别到 ${b.models.all.length} 个远程模型，本地BGE可用`};
$('#testChat').onclick=async()=>{$('#status').textContent='正在执行真实模型测试…';const r=await fetch('/api/v1/model-provider/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...values(),capability:'chat',model:$('#chat').value})}),b=await r.json();$('#status').textContent=r.ok?`测试通过：${b.sample}`:b.detail||'测试失败'};
$('#save').onclick=async()=>{const r=await fetch('/api/v1/model-provider/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...values(),chatModel:$('#chat').value,embeddingModel:$('#embedding').value||localBge,embeddingDimension:dimension||512})}),b=await r.json();if(!r.ok){$('#status').textContent=b.detail||'保存失败';return}$('#status').textContent='模型已保存并启用';$('#key').value='';await load();setTimeout(()=>$('#addPanel').classList.remove('show'),600)};load();
</script></body></html>
