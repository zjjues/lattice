<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北京飞行处置面板</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131d;color:#d9eef7;font-family:system-ui,sans-serif}header{height:58px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#0b2639;border-bottom:1px solid #286078}main{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;padding:14px;height:calc(100vh - 58px)}section{background:#0b1d29;border:1px solid #28536a;border-radius:8px;padding:15px;overflow:auto}h2{font-size:16px;color:#57dfff;margin:0 0 12px}.card{padding:11px;margin:0 0 9px;background:#102a39;border-left:3px solid #4b879f;border-radius:4px}.high{border-color:#ff6b6b}.medium{border-color:#ffd166}.muted{color:#80a8b8;font-size:12px}.kv{display:grid;grid-template-columns:90px 1fr;gap:6px;margin:5px 0}button{border:0;border-radius:5px;padding:8px 12px;background:#19b5d1;color:#03151d;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.action{padding:8px 10px;margin:7px 0;background:#102f3b;border-radius:4px}.provider{display:inline-block;padding:3px 7px;border-radius:10px;background:#245068;color:#aeeeff;font-size:12px}a{color:#53ddff}</style></head>
<body><header><b>Fake Lattice · 飞行告警与处置建议</b><span id="status">正在连接…</span></header><main><section><h2>北京演示实体</h2><div id="entity">等待数据</div><p><a href="/static/beijing-live.html">打开实时态势图 →</a></p></section><section><h2>当前告警</h2><div id="alerts">等待数据</div></section><section><h2>规则 + 知识库处置建议</h2><div id="recommendation" class="muted">选择告警并生成建议。默认不调用大模型。</div></section></main>
<script>
let selectedAlert=null;
const esc=v=>String(v??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){try{const [er,ar]=await Promise.all([fetch('/api/v1/entities/beijing-flight-demo'),fetch('/api/v1/alerts')]);if(!er.ok)throw Error('请先运行北京样例回放');const e=await er.json(),ab=await ar.json(),items=Array.isArray(ab)?ab:(ab.alerts||ab.items||[]),alerts=items.filter(x=>x.entityId==='beijing-flight-demo');const p=e.location?.position||{},t=e.flightTelemetry||{},a=t.attitude||{},v=t.velocity||{};document.querySelector('#entity').innerHTML=`<div class="card"><b>${esc(e.entityId)}</b><div class="kv"><span>坐标</span><span>${p.latitudeDegrees?.toFixed(5)}, ${p.longitudeDegrees?.toFixed(5)}</span><span>高度</span><span>${p.altitudeMeters} m</span><span>空速</span><span>${v.airSpeedMetersPerSecond} m/s</span><span>姿态</span><span>R ${a.rollDegrees}° / P ${a.pitchDegrees}° / Y ${a.yawDegrees}°</span><span>故障</span><span>${esc(t.fault?.active?t.fault.type:'无')}</span></div></div>`;document.querySelector('#alerts').innerHTML=alerts.map(x=>`<div class="card ${x.riskLevel?.toLowerCase()}"><b>${esc(x.title)}</b><p>${esc(x.summary)}</p><div class="muted">${esc(x.alertType)} · ${esc(x.riskLevel)}</div><p><button onclick="recommend('${x.alertId}',this)">生成处置建议</button></p></div>`).join('')||'<span class="muted">暂无告警</span>';document.querySelector('#status').textContent=`已连接 · ${alerts.length} 条告警`;}catch(e){document.querySelector('#status').textContent=e.message}}
async function recommend(id,button){button.disabled=true;selectedAlert=id;document.querySelector('#recommendation').textContent='正在检索 SOP 并生成建议…';try{const r=await fetch(`/api/v1/alerts/${id}/recommendation`,{method:'POST'}),body=await r.json();if(!r.ok)throw Error(body.detail||r.status);const x=body.recommendation;document.querySelector('#recommendation').innerHTML=`<div class="card"><span class="provider">${esc(x.provider)}</span><h3>${esc(x.summary)}</h3><div>${(x.actions||[]).map(a=>`<div class="action">${esc(a)}</div>`).join('')}</div><h3>知识依据</h3>${(x.references||[]).map(ref=>`<div class="muted">${esc(ref.docId)} · ${esc(ref.title)}</div>`).join('')}<p class="muted">置信度：${x.confidence} · 人工确认：${x.providerMetadata?.humanConfirmationRequired?'必须':'按策略'}</p></div>`;}catch(e){document.querySelector('#recommendation').textContent=`生成失败：${e.message}`}finally{button.disabled=false}}
load();setInterval(load,3000);
</script></body></html>
