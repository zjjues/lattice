<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北京飞行态势实时验证</title>
<style>html,body{height:100%;margin:0;background:#071421;color:#dff4ff;font-family:system-ui}main{height:100%;display:grid;grid-template-rows:56px 1fr}header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0b2639;border-bottom:1px solid #2a6b82}#map{position:relative;overflow:hidden;background:radial-gradient(circle,#183d43,#081924)}svg{width:100%;height:100%}.grid{stroke:#61909a;opacity:.2}.ring{fill:none;stroke:#c9aa62;stroke-width:3}.road{fill:none;stroke:#7eaaa7;opacity:.55;stroke-width:2}.label{fill:#cfe4e4;font-size:16px}.route{fill:none;stroke:#23dfff;stroke-width:3}.aircraft{fill:#ffdf59;stroke:#fff;stroke-width:1}.pulse{fill:none;stroke:#ffdf59;animation:p 1.5s infinite;transform-box:fill-box;transform-origin:center}@keyframes p{to{r:28;opacity:0}}aside{position:absolute;top:16px;left:16px;padding:14px;width:290px;background:#06141ee8;border:1px solid #377c91;border-radius:8px;line-height:1.65}aside b{color:#55ddff}.status{color:#ffcf66}.note{position:absolute;right:12px;bottom:12px;background:#06141edc;padding:8px 11px;border:1px solid #377c91;border-radius:5px;font-size:12px}</style></head>
<body><main><header><b>Fake Lattice · 北京实时飞行态势</b><span id="connection" class="status">正在连接…</span></header><section id="map"><svg viewBox="0 0 1200 760"><g class="grid"><path d="M0 100H1200M0 220H1200M0 340H1200M0 460H1200M0 580H1200M0 700H1200M150 0V760M330 0V760M510 0V760M690 0V760M870 0V760M1050 0V760"/></g><g class="road"><path d="M30 650L1150 100M80 110L1100 670M0 410L1200 350M590 0L620 760M0 565L1200 230"/></g><ellipse class="ring" cx="600" cy="390" rx="105" ry="88"/><ellipse class="ring" cx="600" cy="390" rx="205" ry="166"/><ellipse class="ring" cx="600" cy="390" rx="325" ry="260"/><ellipse class="ring" cx="600" cy="390" rx="450" ry="345"/><g class="label"><text x="365" y="410">海淀区</text><text x="530" y="355">西城区</text><text x="635" y="355">东城区</text><text x="755" y="420">朝阳区</text><text x="520" y="610">丰台区</text><text x="875" y="600">通州区</text></g><polyline id="trail" class="route" points=""/><g id="vehicle" visibility="hidden"><circle class="pulse" r="10"/><path class="aircraft" d="M0-22L7-5 27 2 7 7 0 27-7 7-27 2-7-5Z"/></g></svg><aside><b id="name">等待 Entity</b><div id="telemetry">运行北京样例回放后显示遥测。</div></aside><div class="note">本地示意底图 · 非导航用途 · 数据来自 /api/v1/entities</div></section></main>
<script>
const trail=[], vehicle=document.querySelector('#vehicle'), trailNode=document.querySelector('#trail');
function project(lat,lon){return [600+(lon-116.4074)*18000,390-(lat-39.9042)*23000]}
async function refresh(){try{const r=await fetch('/api/v1/entities');if(!r.ok)throw Error(r.status);const body=await r.json();const list=Array.isArray(body)?body:(body.entities?Object.values(body.entities):(body.items||[]));const e=list.find(x=>(x.entityId||'').includes('beijing-flight'))||list.at(-1);document.querySelector('#connection').textContent=`API 已连接 · ${list.length} 个实体`;if(!e)return;const p=e.location?.position||e.location||{},lat=p.latitudeDegrees,lon=p.longitudeDegrees;if(!Number.isFinite(lat)||!Number.isFinite(lon))return;const [x,y]=project(lat,lon);vehicle.setAttribute('transform',`translate(${x} ${y}) rotate(${e.flightTelemetry?.attitude?.yawDegrees||0})`);vehicle.setAttribute('visibility','visible');trail.push(`${x},${y}`);if(trail.length>60)trail.shift();trailNode.setAttribute('points',trail.join(' '));const t=e.flightTelemetry||{},v=t.velocity||{},a=t.attitude||{};document.querySelector('#name').textContent=e.aliases?.name||e.entityId;document.querySelector('#telemetry').innerHTML=`位置：${lat.toFixed(5)}°, ${lon.toFixed(5)}°<br>高度：${(p.altitudeMeters||0).toFixed(1)} m<br>空速：${v.airSpeedMetersPerSecond??'-'} m/s<br>姿态：R ${a.rollDegrees?.toFixed?.(1)??'-'}° / P ${a.pitchDegrees?.toFixed?.(1)??'-'}° / Y ${a.yawDegrees?.toFixed?.(1)??'-'}°<br>故障：${t.fault?.active?(t.fault.type||'active'):'无'}`;}catch(e){document.querySelector('#connection').textContent=`连接失败：${e.message}`}}
refresh();setInterval(refresh,800);
</script></body></html>
