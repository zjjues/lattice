<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识库管理</title>
<style>
:root{--bg:#07131b;--panel:#0c202b;--line:#294653;--text:#dcecf3;--muted:#829da8;--cyan:#69d5f5;--green:#65d49b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}.top{height:70px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid #27414d;background:#091923}.title h1{margin:0;font-size:20px}.title p{margin:5px 0 0;color:var(--muted);font-size:11px}.provider{margin-left:auto;color:#8fb3c0;font-size:11px}.wrap{padding:22px 26px}.toolbar{display:flex;align-items:center;margin-bottom:18px}.toolbar h2{margin:0;font-size:16px}.summary{margin-left:12px;color:var(--muted);font-size:11px}.button{border:1px solid #2b7896;border-radius:7px;background:#15526b;color:#e3f8ff;padding:9px 15px;cursor:pointer}.primary{margin-left:auto;background:#167398}.bases{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.base{min-height:142px;padding:17px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;transition:.15s}.base:hover,.base.active{border-color:#3f91ad;transform:translateY(-1px);box-shadow:0 10px 30px #0004}.folder{display:flex;align-items:center;gap:10px}.folder-icon{width:31px;height:23px;border-radius:4px;background:#2b7591;position:relative}.folder-icon:before{content:"";position:absolute;left:2px;top:-5px;width:13px;height:6px;border-radius:3px 3px 0 0;background:#2b7591}.base h3{margin:0;font-size:14px}.desc{height:34px;margin:14px 0 12px;color:var(--muted);font-size:11px;line-height:1.5}.stats{display:flex;gap:12px;color:#78b8cb;font-size:10px}.workspace{display:none;grid-template-columns:300px 1fr;gap:16px;margin-top:18px}.workspace.show{display:grid}.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px}.panel-head{display:flex;align-items:center;margin-bottom:13px}.panel-head h3{margin:0;font-size:14px}.panel-head button{margin-left:auto}.doc{padding:11px;border-bottom:1px solid #25404b;cursor:pointer}.doc:hover,.doc.active{background:#12303d}.doc b{font-size:12px}.meta{margin-top:5px;color:var(--muted);font-size:10px}.search{display:flex;gap:8px;margin-bottom:12px}input,textarea{width:100%;padding:10px;border:1px solid #355663;border-radius:6px;background:#0d2935;color:#e9f7fb}.search button{margin:0}.chunk{margin:9px 0;padding:13px;border:1px solid #284956;border-radius:7px;background:#091923;white-space:pre-wrap;line-height:1.65}.badge{margin-bottom:7px;color:#73cce8;font-size:10px}.empty{padding:35px;color:#6f8994;text-align:center}.modal{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;background:#02080cbb}.modal.show{display:flex}.dialog{width:min(480px,calc(100vw - 30px));padding:22px;border:1px solid #315463;border-radius:12px;background:#0b202b;box-shadow:0 25px 70px #000a}.dialog h2{margin:0 0 18px;font-size:17px}.dialog label{display:block;margin:12px 0 6px;color:#91aab5}.dialog-actions{display:flex;gap:9px;margin-top:16px}.dialog-actions .button{flex:1}.ghost{background:#102b37;border-color:#365763}.upload-row{display:flex;gap:8px}.upload-row input{padding:7px}.status{min-height:18px;margin-top:8px;color:var(--green);font-size:11px}@media(max-width:800px){.workspace{grid-template-columns:1fr}.bases{grid-template-columns:1fr}}
</style></head>
<body><header class="top"><div class="title"><h1>知识库</h1><p>每个文件夹对应一个独立知识库，可单独管理文档、分段与检索</p></div><span id="provider" class="provider">正在读取向量模型</span></header>
<main class="wrap"><div class="toolbar"><h2>已有知识库</h2><span id="summary" class="summary"></span><button id="newBase" class="button primary">＋ 新增知识库</button></div><section id="bases" class="bases"></section>
<section id="workspace" class="workspace"><aside class="panel"><div class="panel-head"><h3 id="baseTitle">知识库文档</h3></div><div class="upload-row"><input id="file" type="file" accept=".txt,.md,.json,.csv"><button id="upload" class="button">新增文件</button></div><div id="uploadStatus" class="status"></div><div id="documents"></div></aside><section class="panel"><div class="search"><input id="query" placeholder="在当前知识库中进行语义检索"><button id="search" class="button">检索</button></div><div class="panel-head"><h3 id="contentTitle">选择文件查看分段</h3></div><div id="chunks" class="empty">尚未选择文件</div></section></section></main>
<div id="createModal" class="modal"><div class="dialog"><h2>新增知识库</h2><label>知识库名称</label><input id="baseName" placeholder="例如：飞行安全规范"><label>用途说明</label><textarea id="baseDescription" rows="3" placeholder="说明该知识库收录的内容"></textarea><div id="createStatus" class="status"></div><div class="dialog-actions"><button id="cancelCreate" class="button ghost">取消</button><button id="confirmCreate" class="button">创建文件夹知识库</button></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let bases=[],current=null;
async function loadBases(selectId){const r=await fetch('/api/v1/knowledge-bases'),body=await r.json();bases=body.knowledgeBases||[];$('#provider').textContent=`向量模型：${body.embeddingProvider}`;$('#summary').textContent=`${bases.length} 个文件夹知识库 · ${bases.reduce((n,b)=>n+b.documentCount,0)} 份文档`;$('#bases').innerHTML=bases.map(b=>`<article class="base ${current?.id===b.id?'active':''}" data-id="${esc(b.id)}"><div class="folder"><i class="folder-icon"></i><h3>${esc(b.name)}</h3></div><div class="desc">${esc(b.description||'尚未填写说明')}</div><div class="stats"><span>${b.documentCount} 份文件</span><span>${b.chunkCount} 个分段</span><span>${esc(b.folder)}</span></div></article>`).join('')||'<div class="empty">暂无知识库，请点击右上角创建</div>';document.querySelectorAll('.base').forEach(node=>node.onclick=()=>selectBase(node.dataset.id));if(selectId)selectBase(selectId);}
function selectBase(id){current=bases.find(item=>item.id===id);if(!current)return;document.querySelectorAll('.base').forEach(node=>node.classList.toggle('active',node.dataset.id===id));$('#workspace').classList.add('show');$('#baseTitle').textContent=current.name;$('#documents').innerHTML=(current.documents||[]).map(d=>`<div class="doc" data-id="${d.id}"><b>${esc(d.name)}</b><div class="meta">${d.chunk_count} 个分段 · ${esc(d.embedding_provider)}</div></div>`).join('')||'<div class="empty">该知识库暂无文件</div>';document.querySelectorAll('.doc').forEach(node=>node.onclick=()=>showChunks(node.dataset.id,node.querySelector('b').textContent));}
async function showChunks(id,name){document.querySelectorAll('.doc').forEach(node=>node.classList.toggle('active',node.dataset.id===id));const body=await fetch(`/api/v1/rag/documents/${id}/chunks`).then(r=>r.json());$('#contentTitle').textContent=`${name} · ${body.chunks.length} 个分段`;$('#chunks').className='';$('#chunks').innerHTML=body.chunks.map(c=>`<div class="chunk"><div class="badge">分段 ${c.chunk_index+1}</div>${esc(c.content)}</div>`).join('')||'<div class="empty">没有分段</div>';}
$('#newBase').onclick=()=>{$('#createModal').classList.add('show');$('#baseName').focus()};$('#cancelCreate').onclick=()=>$('#createModal').classList.remove('show');
$('#confirmCreate').onclick=async()=>{const r=await fetch('/api/v1/knowledge-bases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#baseName').value,description:$('#baseDescription').value})}),body=await r.json();if(!r.ok){$('#createStatus').textContent=body.detail||'创建失败';return}$('#createModal').classList.remove('show');$('#baseName').value='';$('#baseDescription').value='';await loadBases(body.id)};
$('#upload').onclick=async()=>{const file=$('#file').files[0];if(!current||!file){$('#uploadStatus').textContent='请选择文件';return}const data=new FormData();data.append('file',file);data.append('chunk_size','600');data.append('overlap','100');$('#uploadStatus').textContent='正在保存到文件夹、分段并生成向量…';const r=await fetch(`/api/v1/knowledge-bases/${current.id}/documents`,{method:'POST',body:data}),body=await r.json();if(!r.ok){$('#uploadStatus').textContent=body.detail||'上传失败';return}$('#uploadStatus').textContent=`完成：${body.chunk_count} 个分段`;await loadBases(current.id);showChunks(body.id,body.name)};
$('#search').onclick=async()=>{const q=$('#query').value.trim();if(!current||!q)return;const body=await fetch(`/api/v1/knowledge-bases/${current.id}/search?q=${encodeURIComponent(q)}`).then(r=>r.json());$('#contentTitle').textContent=`${current.name} · 检索结果`;$('#chunks').className='';$('#chunks').innerHTML=body.results.map(c=>`<div class="chunk"><div class="badge">相似度 ${c.score.toFixed(3)} · ${esc(c.documentName)} · 分段 ${c.chunkIndex+1}</div>${esc(c.content)}</div>`).join('')||'<div class="empty">没有结果</div>'};
loadBases();
</script></body></html>
