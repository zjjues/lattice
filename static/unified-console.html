<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>体系任务监控台</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07131b;color:#dcebf2;font:14px system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    .shell{display:grid;grid-template-rows:58px 1fr;width:100%;height:100%}.bar{display:flex;align-items:center;padding:0 20px;background:#091923;border-bottom:1px solid #29434f;box-shadow:0 3px 16px #0007;z-index:2}.brand{display:flex;align-items:center;gap:11px;margin-right:38px;font-size:17px;font-weight:650;white-space:nowrap}.mark{width:25px;height:25px;border:2px solid #58c9ee;border-radius:7px;position:relative;transform:rotate(45deg)}.mark:after{content:"";position:absolute;inset:5px;border:1px solid #58c9ee;border-radius:3px}.nav{display:flex;align-self:stretch;gap:5px}.nav button{position:relative;border:0;background:transparent;color:#8da7b2;padding:0 18px;font:inherit;cursor:pointer}.nav button:hover{color:#d9edf5}.nav button.active{color:#79d8f6}.nav button.active:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:#51c9ef;border-radius:2px}.state{margin-left:auto;color:#78cfa2;font-size:12px}.viewport{position:relative;min-height:0}.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07131b;visibility:hidden;opacity:0;transition:opacity .15s}.view.active{visibility:visible;opacity:1}
  </style>
</head>
<body>
  <main class="shell">
    <header class="bar">
      <div class="brand"><span class="mark"></span><span>体系任务监控台</span></div>
      <nav class="nav" aria-label="功能导航">
        <button class="active" data-view="situation">体系态势</button>
        <button data-view="knowledge">知识库</button>
        <button data-view="models">模型配置</button>
      </nav>
      <span class="state">● 系统运行正常</span>
    </header>
    <section class="viewport">
      <iframe class="view active" data-view="situation" title="体系态势" src="/static/system-operations-v2.html?v=20260801-4"></iframe>
      <iframe class="view" data-view="knowledge" title="知识库" data-src="/static/knowledge-bases.html"></iframe>
      <iframe class="view" data-view="models" title="模型配置" data-src="/static/model-hub.html"></iframe>
    </section>
  </main>
  <script>
    const buttons=[...document.querySelectorAll('.nav button')],views=[...document.querySelectorAll('.view')];
    function select(name){buttons.forEach(button=>button.classList.toggle('active',button.dataset.view===name));views.forEach(view=>{const active=view.dataset.view===name;if(active&&view.dataset.src&&!view.src){view.src=view.dataset.src}view.classList.toggle('active',active)});}
    buttons.forEach(button=>button.addEventListener('click',()=>select(button.dataset.view)));
  </script>
</body>
</html>
