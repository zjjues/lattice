<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外挂知识库</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131b;color:#dcecf3;font:14px system-ui,sans-serif}.top{height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #27414d;background:#0b1b25}h1{font-size:19px;margin:0}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px;height:calc(100vh - 62px)}.panel{background:#0c202b;border:1px solid #294653;border-radius:10px;padding:16px;overflow:auto}h2{font-size:15px;margin:0 0 14px;color:#8bd7f1}label{display:block;margin:10px 0 5px;color:#9cb4bf}input,button{width:100%;padding:9px;border-radius:6px;border:1px solid #365663;background:#102b37;color:#e6f5fa}button{cursor:pointer;background:#176485;border-color:#2583aa;margin-top:10px}.doc{padding:10px;border-bottom:1px solid #263f4a;cursor:pointer}.doc:hover,.doc.active{background:#143443}.meta{font-size:12px;color:#88a3ae;margin-top:4px}.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1}.search button{width:120px;margin:0}.chunk{background:#0a1922;border:1px solid #294754;border-radius:8px;padding:13px;margin:10px 0;white-space:pre-wrap;line-height:1.65}.badge{color:#74d6f4;font-size:12px;margin-bottom:7px}.empty{color:#76909c;padding:30px;text-align:center}.status{min-height:20px;margin-top:10px;color:#70d49b}
</style></head><body><header class="top"><h1>外挂知识库 · Embedding RAG</h1><span id="provider">加载中</span></header><main class="layout"><aside class="panel"><h2>上传文档</h2><input id="file" type="file" accept=".txt,.md,.json,.csv"><label>分段长度</label><input id="size" type="number" value="600" min="100" max="4000"><label>重叠长度</label><input id="overlap" type="number" value="100" min="0" max="1000"><button id="upload">上传并向量化</button><div class="status" id="status"></div><h2 style="margin-top:24px">文档列表</h2><div id="documents"></div></aside><section class="panel"><div class="search"><input id="query" placeholder="输入问题，测试向量检索"><button id="search">语义检索</button></div><h2 id="title">选择文档查看分段</h2><div id="chunks" class="empty">尚未选择文档</div></section></main><script>
const $=selector=>document.querySelector(selector),esc=value=>String(value??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function loadDocuments(){const body=await fetch('/api/v1/rag/documents').then(r=>r.json());$('#provider').textContent=`向量模型：${body.embeddingProvider}`;$('#documents').innerHTML=body.documents.map(d=>`<div class="doc" data-id="${d.id}"><b>${esc(d.name)}</b><div class="meta">${d.chunk_count} 个分段 · ${d.embedding_provider}</div></div>`).join('')||'<div class="empty">暂无文档</div>';document.querySelectorAll('.doc').forEach(node=>node.onclick=()=>showChunks(node.dataset.id,node.querySelector('b').textContent));}
async function showChunks(id,name){document.querySelectorAll('.doc').forEach(n=>n.classList.toggle('active',n.dataset.id===id));const body=await fetch(`/api/v1/rag/documents/${id}/chunks`).then(r=>r.json());$('#title').textContent=`${name} · 分段内容`;$('#chunks').className='';$('#chunks').innerHTML=body.chunks.map(c=>`<div class="chunk"><div class="badge">分段 ${c.chunk_index+1}</div>${esc(c.content)}</div>`).join('');}
$('#upload').onclick=async()=>{const file=$('#file').files[0];if(!file){$('#status').textContent='请选择文档';return}const data=new FormData();data.append('file',file);data.append('chunk_size',$('#size').value);data.append('overlap',$('#overlap').value);$('#status').textContent='正在解析、分段并生成向量…';const response=await fetch('/api/v1/rag/documents',{method:'POST',body:data});const body=await response.json();if(!response.ok){$('#status').textContent=body.detail||'上传失败';return}$('#status').textContent=`完成：${body.chunk_count} 个分段`;await loadDocuments();showChunks(body.id,body.name);};
$('#search').onclick=async()=>{const query=$('#query').value.trim();if(!query)return;const body=await fetch(`/api/v1/rag/search?q=${encodeURIComponent(query)}`).then(r=>r.json());$('#title').textContent=`检索结果 · ${body.results.length} 条`;$('#chunks').className='';$('#chunks').innerHTML=body.results.map(c=>`<div class="chunk"><div class="badge">相似度 ${c.score.toFixed(3)} · ${esc(c.documentName)} · 分段 ${c.chunkIndex+1}</div>${esc(c.content)}</div>`).join('')||'<div class="empty">没有结果</div>';};loadDocuments();
</script></body></html>
