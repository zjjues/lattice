<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北京低空飞行态势</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#06111a;color:#e0f1f7;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}header{height:56px;display:flex;align-items:center;gap:22px;padding:0 18px;background:#071b29eF;border-bottom:1px solid #24536a;position:relative;z-index:10}header b{font-size:17px}.status{font-size:12px;color:#8fb5c4}.ok{color:#4ee0a2}.warn{color:#ffd166}.layout{height:calc(100% - 56px);position:relative}.map{position:absolute;inset:0;background:radial-gradient(circle at 53% 48%,#19434a,#0b2632 58%,#06151f);overflow:hidden}.map svg{width:100%;height:100%}.grid{stroke:#6d9aa2;stroke-width:1;opacity:.18}.minor{fill:none;stroke:#47717b;stroke-width:1.5;opacity:.45}.arterial{fill:none;stroke:#8aa7a4;stroke-width:2.5;opacity:.68}.ring{fill:none;stroke:#d0ad5e;stroke-width:3;opacity:.75}.district{fill:#b9d2d5;font-size:15px;opacity:.68}.water{fill:#123b5a;stroke:#31799e;opacity:.75}.map-note{position:absolute;left:14px;bottom:12px;padding:7px 10px;background:#06131ccf;border:1px solid #29556a;border-radius:5px;color:#8db2c0;font-size:11px}.toolbar{position:absolute;left:16px;top:16px;width:240px;padding:12px;background:#071923e8;border:1px solid #2c6278;border-radius:7px;box-shadow:0 8px 28px #0008}.toolbar-title{font-size:12px;color:#8cb4c3;margin-bottom:8px}.metric-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #19394a}.metric-row:last-child{border:0}.metric-row strong{color:#57ddff}.target-layer{position:absolute;inset:0;pointer-events:none}.target{position:absolute;width:42px;height:42px;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:0;background:transparent;color:#e6fbff}.target .glyph{position:absolute;inset:8px;display:grid;place-items:center;background:#28bad3;clip-path:polygon(50% 0,62% 38%,100% 54%,62% 64%,50% 100%,38% 64%,0 54%,38% 38%);filter:drop-shadow(0 0 6px #37ddff)}.target.threat .glyph{background:#ff6b6b;filter:drop-shadow(0 0 7px #ff4545)}.target .pulse{position:absolute;inset:0;border:2px solid #ff6262;border-radius:50%;animation:pulse 1.7s infinite}.target-label{position:absolute;left:50%;top:42px;transform:translateX(-50%);white-space:nowrap;padding:3px 6px;border-radius:3px;background:#04111bdc;font-size:11px;border:1px solid #28566b}.target.selected .target-label{color:#fff;border-color:#58ddff}.trail{position:absolute;inset:0;pointer-events:none}.drawer{position:absolute;z-index:4;top:12px;right:12px;bottom:12px;width:min(390px,38vw);display:flex;flex-direction:column;background:#071923f2;border:1px solid #2d6479;border-radius:9px;box-shadow:0 12px 38px #000a;overflow:hidden}.drawer-head{padding:14px 16px;border-bottom:1px solid #23485a}.drawer-head h2{font-size:17px;margin:4px 0}.risk{display:inline-block;padding:3px 7px;border-radius:10px;font-size:11px;background:#23495b}.risk.high{background:#79383d;color:#ffd5d5}.drawer-body{overflow:auto;padding:14px 16px}.section{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid #1c3d4d}.section:last-child{border:0}.section h3{font-size:13px;color:#58dcff;margin:0 0 10px}.kv{display:grid;grid-template-columns:82px 1fr;gap:7px;font-size:12px}.kv span:nth-child(odd){color:#7fa6b5}.alert{padding:10px;margin:8px 0;background:#102b39;border-left:3px solid #ffd166;border-radius:4px}.alert.high{border-color:#ff6262}.alert b{font-size:12px}.alert p{font-size:12px;margin:6px 0;color:#b9d0d9}.button{width:100%;padding:9px;border:0;border-radius:5px;background:#21bad3;color:#03131b;font-weight:700;cursor:pointer}.button:disabled{opacity:.5}.recommendation{padding:11px;background:#0e2b38;border:1px solid #255469;border-radius:6px}.recommendation h4{margin:8px 0;font-size:13px}.action{font-size:12px;padding:7px 8px;margin:5px 0;background:#153846;border-radius:4px}.reference{font-size:11px;color:#8eb2bf;margin:5px 0}.empty{font-size:12px;color:#7fa4b1}.legend{position:absolute;left:16px;bottom:52px;display:flex;gap:12px;padding:7px 10px;background:#06131ccc;border:1px solid #29556a;border-radius:5px;font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#28bad3}.dot.red{background:#ff6262}@media(max-width:800px){.drawer{width:44vw}.toolbar{display:none}}
</style></head><body><header><b>Fake Lattice · 北京低空飞行态势</b><span id="connection" class="status warn">正在连接</span><span id="clock" class="status"></span></header><div class="layout"><div class="map"><svg viewBox="0 0 1400 850" preserveAspectRatio="none"><g class="grid"><path d="M0 100H1400M0 220H1400M0 340H1400M0 460H1400M0 580H1400M0 700H1400M160 0V850M340 0V850M520 0V850M700 0V850M880 0V850M1060 0V850"/></g><path class="water" d="M1070 0c-45 120-28 220-58 320s-20 210 30 305 16 150-20 225h378V0z"/><g class="minor"><path d="M0 170L1150 760M80 810L1110 40M0 610L1150 250M250 0L930 850M40 310L1050 675M470 0L350 850"/></g><g class="arterial"><path d="M40 720L1080 100M70 120L1090 740M0 450L1130 390M570 0L650 850M0 650L1150 270"/></g><ellipse class="ring" cx="600" cy="430" rx="105" ry="90"/><ellipse class="ring" cx="600" cy="430" rx="210" ry="175"/><ellipse class="ring" cx="600" cy="430" rx="330" ry="270"/><ellipse class="ring" cx="600" cy="430" rx="470" ry="380"/><g class="district"><text x="345" y="430">海淀区</text><text x="520" y="400">西城区</text><text x="635" y="400">东城区</text><text x="750" y="445">朝阳区</text><text x="520" y="650">丰台区</text><text x="910" y="630">通州区</text><text x="280" y="150">昌平区</text><text x="850" y="150">顺义区</text></g></svg><svg id="trail" class="trail" viewBox="0 0 1400 850" preserveAspectRatio="none"></svg><div id="targets" class="target-layer"></div><div class="toolbar"><div class="toolbar-title">实时态势摘要</div><div class="metric-row"><span>飞行目标</span><strong id="entity-count">0</strong></div><div class="metric-row"><span>威胁目标</span><strong id="threat-count">0</strong></div><div class="metric-row"><span>开放告警</span><strong id="alert-count">0</strong></div></div><div class="legend"><span><i class="dot"></i>正常目标</span><span><i class="dot red"></i>告警目标</span></div><div class="map-note">北京本地示意底图 · 数据层可替换为真实瓦片或 Cesium 3D Tiles</div></div><aside class="drawer"><div class="drawer-head"><span id="risk" class="risk">未选择</span><h2 id="target-name">选择地图上的目标</h2><div id="target-id" class="status">点击飞机图标查看威胁与处置建议</div></div><div id="details" class="drawer-body"><div class="empty">等待目标数据…</div></div></aside></div>
<script>
const state={entities:[],alerts:[],recommendations:[],selected:'beijing-flight-demo',trails:new Map()};const esc=v=>String(v??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function position(e){return e.location?.position||e.location||{}}function project(lat,lon){return{x:600+(lon-116.4074)*18000,y:430-(lat-39.9042)*23000}}function entityAlerts(id){return state.alerts.filter(a=>a.entityId===id&&a.status!=='RESOLVED')}function recFor(alertId){return state.recommendations.find(r=>r.alertId===alertId)}
function renderMap(){const layer=document.querySelector('#targets'),valid=state.entities.filter(e=>{const p=position(e);return Number.isFinite(p.latitudeDegrees)&&Number.isFinite(p.longitudeDegrees)&&Math.abs(p.latitudeDegrees-39.9042)<.04&&Math.abs(p.longitudeDegrees-116.4074)<.05});layer.innerHTML=valid.map(e=>{const p=project(position(e).latitudeDegrees,position(e).longitudeDegrees),alerts=entityAlerts(e.entityId),threat=alerts.some(a=>a.riskLevel==='HIGH'),yaw=e.flightTelemetry?.attitude?.yawDegrees||e.metadata?.track?.headingDegrees||0;return `<button class="target ${threat?'threat':''} ${state.selected===e.entityId?'selected':''}" style="left:${p.x/14}%;top:${p.y/8.5}%" onclick="selectTarget('${esc(e.entityId)}')"><span class="${threat?'pulse':''}"></span><span class="glyph" style="transform:rotate(${yaw}deg)"></span><span class="target-label">${esc(e.aliases?.name||e.entityId)} ${threat?'· HIGH':''}</span></button>`}).join('');document.querySelector('#entity-count').textContent=valid.length;const threats=new Set(state.alerts.filter(a=>a.status!=='RESOLVED').map(a=>a.entityId));document.querySelector('#threat-count').textContent=valid.filter(e=>threats.has(e.entityId)).length;document.querySelector('#alert-count').textContent=state.alerts.filter(a=>a.status!=='RESOLVED').length;const trail=document.querySelector('#trail');for(const e of valid){const p=position(e),xy=project(p.latitudeDegrees,p.longitudeDegrees),points=state.trails.get(e.entityId)||[];const last=points.at(-1);if(!last||Math.abs(last.x-xy.x)>.2||Math.abs(last.y-xy.y)>.2)points.push(xy);if(points.length>80)points.shift();state.trails.set(e.entityId,points)}trail.innerHTML=[...state.trails.entries()].map(([id,pts])=>`<polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${id===state.selected?'#39dcff':'#398295'}" stroke-width="${id===state.selected?3:1.5}" stroke-dasharray="7 5" opacity=".8"/>`).join('')}
function selectTarget(id){state.selected=id;renderMap();renderDrawer()}window.selectTarget=selectTarget;
function renderDrawer(){const e=state.entities.find(x=>x.entityId===state.selected);if(!e){document.querySelector('#details').innerHTML='<div class="empty">地图范围内暂无飞行目标，请运行北京样例回放。</div>';return}const alerts=entityAlerts(e.entityId),p=position(e),t=e.flightTelemetry||{},a=t.attitude||{},v=t.velocity||{},highest=alerts.some(x=>x.riskLevel==='HIGH')?'HIGH':alerts.length?'MEDIUM':'LOW';document.querySelector('#target-name').textContent=e.aliases?.name||e.entityId;document.querySelector('#target-id').textContent=e.entityId;const risk=document.querySelector('#risk');risk.textContent=highest;risk.className=`risk ${highest.toLowerCase()}`;document.querySelector('#details').innerHTML=`<div class="section"><h3>飞行遥测</h3><div class="kv"><span>坐标</span><span>${p.latitudeDegrees?.toFixed(5)}, ${p.longitudeDegrees?.toFixed(5)}</span><span>高度</span><span>${p.altitudeMeters??'-'} m</span><span>空速</span><span>${v.airSpeedMetersPerSecond??'-'} m/s</span><span>地速</span><span>${v.groundSpeedMetersPerSecond??e.metadata?.track?.speedMps??'-'} m/s</span><span>姿态</span><span>R ${a.rollDegrees??'-'}° / P ${a.pitchDegrees??'-'}° / Y ${a.yawDegrees??'-'}°</span><span>故障</span><span>${esc(t.fault?.active?t.fault.type:'无')}</span></div></div><div class="section"><h3>关联威胁与告警</h3>${alerts.length?alerts.map(x=>`<div class="alert ${x.riskLevel?.toLowerCase()}"><b>${esc(x.title)}</b><p>${esc(x.summary)}</p><span class="status">${esc(x.alertType)} · ${esc(x.riskLevel)}</span><div style="margin-top:8px"><button class="button" onclick="recommend('${x.alertId}',this)">${recFor(x.alertId)?'刷新/查看处置建议':'生成处置建议'}</button></div>${renderRecommendation(recFor(x.alertId))}</div>`).join(''):'<div class="empty">当前没有开放告警</div>'}</div>`}
function renderRecommendation(x){if(!x)return'';return `<div class="recommendation"><span class="status ok">${esc(x.provider)}</span><h4>${esc(x.summary)}</h4>${(x.actions||[]).map(a=>`<div class="action">${esc(a)}</div>`).join('')}<h4>知识依据</h4>${(x.references||[]).map(r=>`<div class="reference">${esc(r.docId)} · ${esc(r.title)}</div>`).join('')}<div class="reference">人工确认：${x.providerMetadata?.humanConfirmationRequired?'必须':'按策略'}</div></div>`}
async function recommend(id,button){button.disabled=true;button.textContent='生成中…';try{const r=await fetch(`/api/v1/alerts/${id}/recommendation`,{method:'POST'}),b=await r.json();if(!r.ok)throw Error(b.detail||r.status);state.recommendations=state.recommendations.filter(x=>x.alertId!==id);state.recommendations.unshift(b.recommendation);renderDrawer()}catch(e){alert(`生成失败：${e.message}`)}finally{button.disabled=false}}window.recommend=recommend;
async function refresh(){try{const [er,ar,rr]=await Promise.all([fetch('/api/v1/entities'),fetch('/api/v1/alerts'),fetch('/api/v1/recommendations')]);const eb=await er.json(),ab=await ar.json(),rb=await rr.json();state.entities=Array.isArray(eb)?eb:Object.values(eb.entities||{});state.alerts=Array.isArray(ab)?ab:(ab.alerts||ab.items||[]);state.recommendations=Array.isArray(rb)?rb:(rb.recommendations||rb.items||[]);document.querySelector('#connection').textContent='● 数据链路正常';document.querySelector('#connection').className='status ok';renderMap();renderDrawer()}catch(e){document.querySelector('#connection').textContent=`● ${e.message}`;document.querySelector('#connection').className='status warn'}}setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleString('zh-CN'),1000);refresh();setInterval(refresh,1500);
</script></body></html>
